services:
  remote-pi-relay:
    image: ghcr.io/jacobaraujo7/remote-pi-relay:latest
    container_name: remote-pi-relay
    restart: unless-stopped
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.remote-pi.rule=Host(`remote-pi.jonbatista.dev`)"
      - "traefik.http.routers.remote-pi.entrypoints=websecure"
      - "traefik.http.routers.remote-pi.tls.certresolver=myresolver"
      - "traefik.http.services.remote-pi.loadbalancer.server.port=3000"

networks:
  traefik-net:
    external: true
